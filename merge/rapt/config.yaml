# ==============================================================================
# RAPT (V0.3 迁移版) 统一配置 —— 唯一事实来源
#
# 所有 merge/ 与 eval/ 脚本默认从这里读取; 环境变量仅用于单次临时覆盖,
# 实际生效值会写入产物 meta / 评测 manifest, 便于事后对齐与审计。
#
# 路径均相对项目根 (/root/autodl-tmp/AdaMMS); 换机器只需改 paths 与 groups。
# ==============================================================================
version: rapt-v0.3

paths:
  project_root: /root/autodl-tmp/AdaMMS
  models: downloaded_models            # base / donor / anchor 权重
  merged_models: merge/rapt/merged_models
  work: merge/rapt/work                # Stage-1/2 缓存
  eval_results: merge/rapt/eval_results
  logs: merge/rapt/logs
  lmms_eval_repo: lmms-eval
  vlmevalkit_repo: VLMEvalKit
  python: /root/autodl-tmp/envs/vita_qwen2vl/bin/python

# ------------------------------------------------------------------------------
# 合并超参 (TA_hyb 已确认最优点, 见方法说明 §21.6)
# 这些参数对三组模型**完全一致**, 不同组只改 groups.<g>.interp_alpha
# ------------------------------------------------------------------------------
merge:
  backend: ta_hyb                      # ta_hyb | pipeline
  groups: [g1, g3_fwd, g3_rev]         # run_merge_all.sh 默认跑这三组
  rank: 128
  alpha: 0.5                           # band 注入强度
  interp_alpha: 0.1                    # 插值系数 (hybrid)
  target: task_delta
  gate: apt
  mode: hybrid
  budget: raw                          # inject 口径; bulk 由 stage3 内部默认 rel
  multiway: output_sum                 # output_sum | mean
  device: auto                         # auto | cpu | cuda
  identity_mapping: true
  stage2:
    tau: 0.15
    sinkhorn_iters: 50
  variants:                            # 零新超参方案开关 (默认全关 = TA_hyb)
    ortho_scale: false                 # 方案 B (MRC)
    conflict_filter: false             # 方案 C
  mrc_interp_alpha:                    # MRC 用 R3 自主选出的 ia (方案 B 开启时生效)
    g1: 0.2
    g3_fwd: 0.3
    g3_rev: 0.3

# ------------------------------------------------------------------------------
# 模型组 (anchor / host / donor 均为 paths.models 下的目录名)
# ------------------------------------------------------------------------------
groups:
  g1:
    anchor: Qwen2-7B
    host: Qwen2-VL-7B-Instruct
    donor: llava-onevision-qwen2-7b-si-hf
    family: qwen2vl                    # lmms-eval / VLMEvalKit 的模型族
    interp_alpha: 0.1                  # TA_hyb 最优
  g3_fwd:
    anchor: Llama-2-7b-hf
    host: llava-v1.5-7b
    donor: mplug-owl2-llama2-7b
    family: llava
    interp_alpha: 0.1
  g3_rev:
    anchor: Llama-2-7b-hf
    host: mplug-owl2-llama2-7b
    donor: llava-v1.5-7b
    family: mplug
    interp_alpha: 0.1

# ------------------------------------------------------------------------------
# 评测超参 (固定; base 与 merged 必须使用同一套)
# ------------------------------------------------------------------------------
eval:
  # 逐任务、按样本数升序 (与 eval_qwen2vl_lmms.sh / eval8.sh 一致)
  lmms_eval:
    tasks:
      - mmmu_val
      - ocrbench
      - mme
      - vizwiz_vqa_val
      - textvqa_val
      - ok_vqa
      - gqa
      - seedbench
    min_pixels: 3136
    max_pixels: 12845056
    max_num_frames: 16
    max_new_tokens: 256
    temperature: 0
    batch_size: 1
    gpu: 0
    llava_model_name: llava-v1.5-7b       # 合并产物名不含 llava 时的 builder 提示
    stage_local: true                      # 评测前拷贝到本地盘 (NFS 读 7B 权重慢)
  # VLMEvalKit: max_new_tokens 为 null 时保持框架默认 2048 (Qwen2VLChat)
  vlmeval:
    datasets:
      - TextVQA_VAL
      - OCRVQA_TESTCORE
      - VizWiz
      - GQA_TestDev_Balanced
      - ChartQA_TEST
    min_pixels: 1003520
    max_pixels: 12845056
    max_new_tokens: null
    mode: all
    reuse: false
    nproc_per_node: 1
    gpu: 0
  pairs:
    roles: [base, merged]
    both_frameworks: true              # base/merged 各跑 lmms-eval 与 VLMEvalKit
