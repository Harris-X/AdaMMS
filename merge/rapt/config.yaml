# ==============================================================================
# RAPT (V0.3 迁移版) 全局默认配置
#
# 配置分两层:
#   1) 本文件: paths / merge / eval 的全局默认
#   2) configs/groups/<group>.yaml: 单个模型组 (anchor/host/donor/family + 可选覆盖)
#
# 所有 merge/ 与 eval/ 脚本通过 tools/cfg.py 合并两层后读取;
# 环境变量仅用于单次临时覆盖, 实际生效值写入产物 meta / 评测 manifest。
#
# 路径均相对项目根 (/root/autodl-tmp/AdaMMS); 换机器只需改 paths 与模型组文件。
# ==============================================================================
version: rapt-v0.3

paths:
  project_root: /root/autodl-tmp/AdaMMS
  models: downloaded_models            # base / donor / anchor 权重
  merged_models: merge/rapt/merged_models
  work: merge/rapt/work                # Stage-1/2 缓存
  eval_results: merge/rapt/eval_results
  logs: merge/rapt/logs
  lmms_eval_repo: lmms-eval
  vlmevalkit_repo: VLMEvalKit
  python: /root/autodl-tmp/envs/vita_qwen2vl/bin/python

# ------------------------------------------------------------------------------
# 合并超参 (TA_hyb 已确认最优点, 见方法说明 §21.6)
# 这里是**全局默认**; 单个模型组可在 configs/groups/<g>.yaml 的 merge: 段覆盖。
# 模型组定义不在本文件: 见 merge/rapt/configs/groups/*.yaml (每组一个文件)。
# ------------------------------------------------------------------------------
merge:
  backend: ta_hyb                      # ta_hyb | pipeline (可被组配置覆盖)
  groups: [g1, g3_fwd, g3_rev]         # run_merge_all.sh 默认组列表
  rank: 128
  alpha: 0.5                           # band 注入强度
  interp_alpha: 0.1                    # 插值系数 (hybrid)
  target: task_delta
  gate: apt
  mode: hybrid
  budget: raw                          # inject 口径; bulk 由 stage3 内部默认 rel
  multiway: output_sum                 # output_sum | mean
  device: auto                         # auto | cpu | cuda
  identity_mapping: true
  stage2:
    tau: 0.15
    sinkhorn_iters: 50
  variants:                            # 零新超参方案开关 (默认全关 = TA_hyb)
    ortho_scale: false                 # 方案 B (MRC)
    conflict_filter: false             # 方案 C

# ------------------------------------------------------------------------------
# 评测超参 (固定; base 与 merged 必须使用同一套)
# ------------------------------------------------------------------------------
eval:
  # 逐任务、按样本数升序 (与 eval_qwen2vl_lmms.sh / eval8.sh 一致)
  lmms_eval:
    tasks:
      - mmmu_val
      - ocrbench
      - mme
      - vizwiz_vqa_val
      - textvqa_val
      - ok_vqa
      - gqa
      - seedbench
    min_pixels: 3136
    max_pixels: 12845056
    max_num_frames: 16
    max_new_tokens: 256
    temperature: 0
    batch_size: 1
    gpu: 0
    llava_model_name: llava-v1.5-7b       # 合并产物名不含 llava 时的 builder 提示
    stage_local: true                      # 评测前拷贝到本地盘 (NFS 读 7B 权重慢)
  # VLMEvalKit: max_new_tokens 为 null 时保持框架默认 2048 (Qwen2VLChat)
  vlmeval:
    datasets:
      - TextVQA_VAL
      - OCRVQA_TESTCORE
      - VizWiz
      - GQA_TestDev_Balanced
      - ChartQA_TEST
    min_pixels: 1003520
    max_pixels: 12845056
    max_new_tokens: null
    mode: all
    reuse: false
    nproc_per_node: 1
    gpu: 0
  pairs:
    roles: [base, merged]
    both_frameworks: true              # base/merged 各跑 lmms-eval 与 VLMEvalKit
