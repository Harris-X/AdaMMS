# 模型组配置: g1
# --group g1 时生效。组文件是唯一来源: 改这里即可切换/替换模型, 不必改主 config。
name: g1
description: "Qwen2-VL-7B-Instruct <- llava-onevision-qwen2-7b-si-hf (同 Qwen2 系; anchor=Qwen2-7B)"
status: ready

family: qwen2vl            # 评测适配器: lmms-eval qwen2_vl / VLMEvalKit Qwen2VLChat
anchor: Qwen2-7B           # 共同基座 W_0 (task vector τ = W − W_0)
host: Qwen2-VL-7B-Instruct # 输出骨架 / base
donor: llava-onevision-qwen2-7b-si-hf

interp_alpha: 0.1          # TA_hyb 最优插值系数
mrc_interp_alpha: 0.2      # 方案 B (ortho-scale) 的 R3 自主选 ia
backend: ta_hyb            # ta_hyb | pipeline
